name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # Runners have network, so a failed Matrix Market download is a real
      # failure here rather than the skip an offline compute node gets.
      - name: Cache Matrix Market downloads
        uses: actions/cache@v4
        with:
          path: tests/_data
          key: matrixmarket-${{ hashFiles('tests/matrixmarket.py') }}

      - name: Test
        run: uv run pytest
        env:
          MPLBACKEND: Agg
          NONMODAL_TEST_REQUIRE_DOWNLOADS: '1'
